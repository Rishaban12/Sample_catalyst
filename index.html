<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Record Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Employee Record</h1>

    <form id="employeeForm">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter full name" required>
      </div>

      <div class="field">
        <label for="role">Role</label>
        <input type="text" id="role" name="role" placeholder="Enter role / designation" required>
      </div>

      <div class="field">
        <label for="salary">Salary</label>
        <input type="number" id="salary" name="salary" placeholder="Enter salary" min="0" step="0.01" required>
      </div>

      <div class="field">
        <label for="data">Date</label>
        <input type="date" id="data" name="data" required>
      </div>

      <div class="field">
        <label for="created_at">Created At</label>
        <input type="datetime-local" id="created_at" name="created_at" readonly>
      </div>

      <div class="field">
        <label for="updated_at">Updated At</label>
        <input type="datetime-local" id="updated_at" name="updated_at" readonly>
      </div>

      <div class="actions">
        <button type="submit" id="submitBtn">Submit</button>
        <button type="button" id="clearBtn" class="secondary">Clear All</button>
      </div>
    </form>

    <h2>Records</h2>
    <div class="table-wrapper">
      <table id="recordsTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Salary</th>
            <th>Date</th>
            <th>Created At</th>
            <th>Updated At</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="recordsBody">
        </tbody>
      </table>
      <p id="emptyMsg" class="empty-msg">No records yet.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
